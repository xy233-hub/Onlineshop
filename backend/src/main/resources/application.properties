spring.application.name=onlineshop
# 1. 配置MySQL 8.x驱动
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/onlineshop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
# 2. MyBatis配置Mapper XML路径
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.shop.entity
mybatis.configuration.map-underscore-to-camel-case=true

# 文件：src/main/resources/application.properties
spring.jackson.property-naming-strategy=SNAKE_CASE

media.upload-dir=D:/Onlineshop/backend/uploads
media.base-url=http://localhost:8080/media

# Redis 配置（下单性能优化缓存）
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=5000ms

# HikariCP 连接池配置（下单性能优化）
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

